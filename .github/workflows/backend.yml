# Roda os testes do backend a cada push e pull request que mexa em backend/.
name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nespoli
          POSTGRES_PASSWORD: nespoli
          POSTGRES_DB: nespoli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nespoli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Chaves descartáveis, usadas só nos testes.
      TEST_DATABASE_URL: postgresql://nespoli:nespoli@localhost:5432/nespoli_test
      DATABASE_URL: postgresql://nespoli:nespoli@localhost:5432/nespoli_test
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BLIND_INDEX_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Confere se a imagem da hospedagem monta e se o servidor sobe nela,
      # aplicando as migrações e respondendo na verificação de saúde.
      - name: Montar e subir a imagem Docker
        run: |
          docker build -t nespoli-backend .
          docker run -d --name api --network host \
            -e DATABASE_URL -e FIELD_ENCRYPTION_KEY -e BLIND_INDEX_KEY -e PORT=3100 nespoli-backend
          for i in $(seq 1 30); do
            if curl -fs localhost:3100/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
