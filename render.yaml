# Configuração da hospedagem no Render ("Blueprint"). No painel do Render:
# New > Blueprint, escolher este repositório, e ele cria o servidor e o banco
# descritos aqui. Segredos nunca ficam neste arquivo: as chaves de
# criptografia são geradas pelo próprio Render, e as do Pluggy são digitadas
# no painel (sync: false).
services:
  - type: web
    name: nespoli-finance-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nespoli-finance-db
          property: connectionString
      # 32 bytes aleatórios em base64, gerados uma vez pelo Render.
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: BLIND_INDEX_KEY
        generateValue: true
      # Assina os tokens de sessão do login com a Apple.
      - key: SESSION_SIGNING_KEY
        generateValue: true
      # Preenchidas no painel. O segredo do webhook vai no endereço, por isso
      # deve ser só letras e números (gere com: openssl rand -hex 32).
      - key: PLUGGY_CLIENT_ID
        sync: false
      - key: PLUGGY_CLIENT_SECRET
        sync: false
      - key: PLUGGY_WEBHOOK_SECRET
        sync: false
      # Endereço público do servidor, por exemplo https://nespoli-finance-api.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: nespoli-finance-db
    databaseName: nespoli
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
    # Só o servidor acessa o banco; nenhum endereço de fora.
    ipAllowList: []
